<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>AETHER — Sobrevivência Alienígena</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#030008; display:flex; align-items:center;
  justify-content:center; height:100vh; overflow:hidden; user-select:none;
  font-family:'Courier New',monospace;
}
canvas { display:block; cursor:crosshair; }
.screen {
  position:fixed; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(3,0,8,0.97); z-index:100;
}
.screen h1 {
  font-size:clamp(2rem,5vw,3.5rem); letter-spacing:0.4em;
  color:#00e5ff; text-shadow:0 0 20px #00e5ff,0 0 60px #00e5ff55;
  margin-bottom:0.3em;
}
.screen p { color:#505070; font-size:0.85rem; letter-spacing:0.15em; margin-bottom:2.5em; text-align:center; line-height:1.9; }
.btn {
  font-family:'Courier New',monospace; font-size:0.95rem; color:#00e5ff;
  background:transparent; border:1px solid #00e5ff44; padding:0.7em 2.5em;
  cursor:pointer; letter-spacing:0.2em; transition:all 0.2s; margin:0.3em;
}
.btn:hover { background:#00e5ff18; border-color:#00e5ff; box-shadow:0 0 20px #00e5ff33; }
.btn.red { color:#ff4455; border-color:#ff445544; }
.btn.red:hover { background:#ff445518; border-color:#ff4455; }
#death-reason { color:#ff6677 !important; }
</style>
</head>
<body>

<div id="screen-title" class="screen">
  <h1>AETHER</h1>
  <p>
    Sua nave caiu num planeta alienígena desconhecido.<br>
    Minere recursos · Construa sua base · Sobreviva às noites.<br><br>
    <span style="color:#303050">WASD/SETAS — MOVER &nbsp;|&nbsp; E (segurar) — MINERAR &nbsp;|&nbsp; 1-4 — CONSTRUIR &nbsp;|&nbsp; F — ATACAR</span>
  </p>
  <button class="btn" onclick="startGame()">▶ INICIAR MISSÃO</button>
</div>

<div id="screen-gameover" class="screen" style="display:none">
  <h1 style="color:#ff4455;text-shadow:0 0 20px #ff4455,0 0 60px #ff445544">MISSÃO FALHOU</h1>
  <p id="death-reason">O astronauta não sobreviveu.</p>
  <button class="btn red" onclick="startGame()">↺ TENTAR NOVAMENTE</button>
  <button class="btn" onclick="showTitle()">← MENU</button>
</div>

<canvas id="c"></canvas>
<script>
'use strict';
// ─── CONSTANTS ──────────────────────────────────────────────────────────────
const TILE=40, COLS=80, ROWS=60;
const WW=COLS*TILE, WH=ROWS*TILE;
const CVW=900, CVH=600;
const DAY_PERIOD=200; // seconds per full cycle

const T={VOID:0,GROUND:1,ROCK:2,DEEP:3,SAND:4,FLORA:5};

const RES_DATA=[
  {name:'Crystal', color:'#00d4ff', glow:'#0055aa'},
  {name:'Resina',  color:'#ff9900', glow:'#993300'},
  {name:'Composto',color:'#44ff88', glow:'#008833'},
  {name:'Minério', color:'#ff4488', glow:'#880033'},
  {name:'Orgânico',color:'#99ff33', glow:'#336600'},
  {name:'Gelo',    color:'#88ddff', glow:'#0099ff'},
  {name:'Gás',     color:'#ccaa00', glow:'#ffff00'},
  {name:'Artefato',color:'#ff00ff', glow:'#ff00aa'},
  {name:'Joia',    color:'#ff69b4', glow:'#ff1493'},
  {name:'Combustível', color:'#8b4513', glow:'#a0522d'},
  {name:'Platina', color:'#e5e4e2', glow:'#ffffff'},
  {name:'Titânio', color:'#ccccdd', glow:'#aabbcc'},
];

const STRUCT_DATA=[
  {name:'Habitat',    w:2,h:2,color:'#3399ff',cost:{2:6,1:4},  desc:'Regenera O²/HP'},
  {name:'Solar',      w:2,h:1,color:'#ffdd00',cost:{0:3,3:2},  desc:'Energia dia'},
  {name:'Depósito',   w:1,h:1,color:'#8888aa',cost:{1:4},      desc:'+cap. inv'},
  {name:'Fabricador', w:2,h:2,color:'#ff8833',cost:{3:6,0:4},  desc:'Craftar itens'},
  {name:'Laboratório',w:2,h:2,color:'#dd00dd',cost:{7:8,0:6},  desc:'Pesquisar'},
  {name:'Fazenda',    w:2,h:2,color:'#00aa00',cost:{4:5,8:3},  desc:'Produz Orgânico'},
  {name:'Extrator água',w:1,h:1,color:'#0088ff',cost:{0:4,2:3}, desc:'Produz Gelo'},
  {name:'Turbina',    w:2,h:2,color:'#888888',cost:{10:6,0:5}, desc:'Energia noite'},
  {name:'Escudo',     w:1,h:1,color:'#ff0000',cost:{0:8,10:5}, desc:'Proteção clima'},
  {name:'Torre luz',  w:1,h:1,color:'#ffff00',cost:{0:3},      desc:'Ilumina área'},
  {name:'Aterrador', w:2,h:1,color:'#555555',cost:{1:6,3:4},  desc:'Caminho base'},
  {name:'Tanque O2',  w:1,h:1,color:'#00ffff',cost:{2:4,6:3},  desc:'Armazena O2'},
  {name:'Gerador nuclear',w:3,h:3,color:'#00ff00',cost:{7:12,10:8,11:5}, desc:'Energia infinita'},
  {name:'Rampa pouso',w:3,h:3,color:'#ffaa00',cost:{10:15,11:10,0:20}, desc:'Plataforma escape'},
  {name:'Câmara pesquisa',w:2,h:2,color:'#9900ff',cost:{7:10,0:8}, desc:'Pesq. avançada'},
];

// ─── STATE ──────────────────────────────────────────────────────────────────
let canvas,ctx,keys={},mouse={x:0,y:0,wx:0,wy:0};
let world={tiles:null,resources:[],structures:[],particles:[],events:[]};
let player={};
let cam={x:0,y:0};
let gameTime=0, dayCycle=0, frame=0, running=false, lastTime=0;
let buildMode=null;
let rngSeed=42;
let techTree={}, crafting={}, paused=false, achievements={};
let nextEventTime=0, eventType=null;

// ─── UTILS ──────────────────────────────────────────────────────────────────
function rng(n){n=((n+rngSeed)*1664525+1013904223)&0xffffffff;return(n>>>16)/65536;}
function noise2d(x,y){
  const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const a=rng(ix*1000+iy),b=rng((ix+1)*1000+iy),c=rng(ix*1000+(iy+1)),d=rng((ix+1)*1000+(iy+1));
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy;
}
function lerpCol(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t].map(Math.floor);}
function rectOverlap(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function inv(ent){return{x:ent.x,y:ent.y,w:ent.w,h:ent.h};}

// ─── WORLD GEN ──────────────────────────────────────────────────────────────
function generateWorld(){
  rngSeed=Math.floor(Math.random()*99999);
  const tiles=new Uint8Array(COLS*ROWS);
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const n=noise2d(x/10,y/10)+noise2d(x/4,y/4)*0.3;
    tiles[y*COLS+x]=n>0.75?T.ROCK:n>0.67?T.DEEP:n<0.22?T.SAND:rng(x*71+y*37)>0.93?T.FLORA:T.GROUND;
  }
  const sx=Math.floor(COLS/2),sy=Math.floor(ROWS/2);
  for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++) tiles[(sy+dy)*COLS+(sx+dx)]=T.GROUND;
  return tiles;
}

function spawnResources(){
  const res=[];
  const counts=[60,55,60,50,45];
  for(let type=0;type<5;type++){
    let placed=0,att=0;
    while(placed<counts[type]&&att<8000){
      att++;
      const x=2+Math.floor(rng(att*type+placed*19)*(COLS-4));
      const y=2+Math.floor(rng(att*type*3+placed*13)*(ROWS-4));
      const t=world.tiles[y*COLS+x];
      if((t===T.GROUND||t===T.SAND)&&Math.hypot(x-COLS/2,y-ROWS/2)>5){
        res.push({x:x*TILE+TILE/2,y:y*TILE+TILE/2,type,amount:3+Math.floor(rng(placed)*6),maxAmount:9,mineProgress:0,id:res.length});
        placed++;
      }
    }
  }
  return res;
}

// ─── PLAYER ─────────────────────────────────────────────────────────────────
function initPlayer(){
  return{
    x:WW/2,y:WH/2,vx:0,vy:0,w:20,h:26,
    speed:185, health:100,maxHealth:100,
    o2:100,maxO2:100, facing:1,walkAnim:0,
    inv:new Array(12).fill(0),maxInv:40,
    miningTarget:null,mineProgress:0,
    alive:true,score:0,
    nearHabitat:false, survivalTime:0,
    mineSpeedMult:1, o2ConsumptionMult:1,
  };
}

// ─── STRUCTURES ─────────────────────────────────────────────────────────────
function placeStructure(type,tx,ty,free=false){
  const sd=STRUCT_DATA[type];
  if(!free){
    for(const[k,v]of Object.entries(sd.cost)) player.inv[+k]-=v;
  }
  world.structures.push({type,tx,ty,wx:tx*TILE,wy:ty*TILE,w:sd.w*TILE,h:sd.h*TILE,hp:100,id:Math.random()});
  for(let dy=0;dy<sd.h;dy++) for(let dx=0;dx<sd.w;dx++) world.tiles[(ty+dy)*COLS+(tx+dx)]=T.VOID;
  spawnParticles(tx*TILE+sd.w*TILE/2,ty*TILE+sd.h*TILE/2,STRUCT_DATA[type].color,16);
}

function canPlace(type,tx,ty){
  const sd=STRUCT_DATA[type];
  if(tx<1||ty<1||tx+sd.w>COLS-1||ty+sd.h>ROWS-1)return false;
  for(let dy=0;dy<sd.h;dy++) for(let dx=0;dx<sd.w;dx++){
    const t=world.tiles[(ty+dy)*COLS+(tx+dx)];
    if(t===T.ROCK||t===T.DEEP||t===T.VOID)return false;
  }
  for(const s of world.structures) if(rectOverlap(tx*TILE,ty*TILE,sd.w*TILE,sd.h*TILE,s.wx,s.wy,s.w,s.h))return false;
  return true;
}

function canAfford(type){
  for(const[k,v]of Object.entries(STRUCT_DATA[type].cost)) if((player.inv[+k]||0)<v)return false;
  return true;
}

// ─── ALIENS ─────────────────────────────────────────────────────────────────
function spawnAlien(x,y,type){
  return{
    x,y,vx:0,vy:0,type,
    speed:[65,95,50][type],
    health:[35,18,80][type],maxHealth:[35,18,80][type],
    damage:[20,10,35][type],
    attackCd:0,state:'roam',roamTarget:null,roamTimer:0,
    size:[18,12,26][type],
    color:['#ff0088','#ff6600','#7700ff'][type],
    id:Math.random(),anim:Math.random()*6.28,dying:false,alpha:1,
  };
}

function spawnWave(){
  const isNight=dayCycle>0.48&&dayCycle<0.98;
  if(!isNight)return;
  const count=2+Math.floor(gameTime/180);
  for(let i=0;i<count;i++){
    const ang=Math.random()*Math.PI*2;
    const dist=380+Math.random()*180;
    const ax=player.x+Math.cos(ang)*dist, ay=player.y+Math.sin(ang)*dist;
    if(ax>TILE&&ax<WW-TILE&&ay>TILE&&ay<WH-TILE)
      world.aliens.push(spawnAlien(ax,ay,Math.floor(Math.random()*3)));
  }
}

// ─── PARTICLES ───────────────────────────────────────────────────────────────
function spawnParticles(x,y,color,n=6){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=30+Math.random()*90,life=0.3+Math.random()*0.6;
    world.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life,maxLife:life,size:2+Math.random()*3});
  }
}

// ─── COLLISION ───────────────────────────────────────────────────────────────
function tileBlocked(x,y,w,h){
  const hw=w/2,hh=h/2;
  const x1=Math.floor((x-hw)/TILE),x2=Math.floor((x+hw-1)/TILE);
  const y1=Math.floor((y-hh)/TILE),y2=Math.floor((y+hh-1)/TILE);
  for(let ty=y1;ty<=y2;ty++) for(let tx=x1;tx<=x2;tx++){
    if(tx<0||tx>=COLS||ty<0||ty>=ROWS)return true;
    const t=world.tiles[ty*COLS+tx];
    if(t===T.ROCK||t===T.DEEP||t===T.VOID)return true;
  }
  return false;
}

function moveEnt(e,dt){
  const nx=e.x+e.vx*dt,ny=e.y+e.vy*dt;
  if(!tileBlocked(nx,e.y,e.w,e.h))e.x=nx;
  if(!tileBlocked(e.x,ny,e.w,e.h))e.y=ny;
}

// ─── UPDATE ──────────────────────────────────────────────────────────────────
function update(dt){
  gameTime+=dt; frame++;
  dayCycle=(gameTime%DAY_PERIOD)/DAY_PERIOD;
  if(gameTime>nextEventTime&&Math.random()<0.3){spawnWeatherParticles();nextEventTime=gameTime+30;}

  updatePlayer(dt);
  updateAchievements(dt);
  for(const p of world.particles){
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.88; p.vy*=0.88; p.life-=dt;
  }
  world.particles=world.particles.filter(p=>p.life>0);

  const tx=player.x-CVW/2, ty2=player.y-CVH/2;
  cam.x+=(tx-cam.x)*0.08; cam.y+=(ty2-cam.y)*0.08;
  cam.x=Math.max(0,Math.min(WW-CVW,cam.x));
  cam.y=Math.max(0,Math.min(WH-CVH,cam.y));
  mouse.wx=mouse.x+cam.x; mouse.wy=mouse.y+cam.y;
}

function updatePlayer(dt){
  if(!player.alive)return;
  player.survivalTime+=dt;
  player.attackCooldown=Math.max(0,player.attackCooldown-dt);

  let dx=0,dy=0;
  if(keys['KeyA']||keys['ArrowLeft'])dx-=1;
  if(keys['KeyD']||keys['ArrowRight'])dx+=1;
  if(keys['KeyW']||keys['ArrowUp'])dy-=1;
  if(keys['KeyS']||keys['ArrowDown'])dy+=1;

  if(dx||dy){
    const len=Math.hypot(dx,dy);
    player.vx=(dx/len)*player.speed; player.vy=(dy/len)*player.speed;
    if(dx)player.facing=dx>0?1:-1;
    player.walkAnim+=dt*7;
  } else { player.vx*=0.75; player.vy*=0.75; }

  moveEnt(player,dt);
  player.x=Math.max(20,Math.min(WW-20,player.x));
  player.y=Math.max(20,Math.min(WH-20,player.y));

  // O2 zone check
  player.nearHabitat=false;
  for(const s of world.structures){
    if(s.type===0){
      const cx=s.wx+s.w/2,cy=s.wy+s.h/2;
      if(Math.hypot(player.x-cx,player.y-cy)<170){player.nearHabitat=true;break;}
    }
  }

  if(player.nearHabitat){
    player.o2=Math.min(player.maxO2,player.o2+25*dt);
    player.health=Math.min(player.maxHealth,player.health+8*dt);
  } else {
    player.o2-=2.5*dt;
    if(player.o2<=0){player.o2=0;player.health-=12*dt;}
  }

  if(keys['KeyE']&&!buildMode)doMining(dt); else {player.miningTarget=null;player.mineProgress=0;}

  if(player.health<=0){
    player.alive=false;
    const reason=player.o2<=0?'Morte por asfixia — O² esgotado':'Morte por exposição planetária';
    setTimeout(()=>{
      document.getElementById('death-reason').textContent=`${reason} · ${Math.floor(player.survivalTime)}s sobrevividos`;
      document.getElementById('screen-gameover').style.display='flex';
    },1200);
  }
}

function doMining(dt){
  let closest=null,closestDist=75;
  for(const r of world.resources){
    if(r.amount<=0)continue;
    const d=Math.hypot(player.x-r.x,player.y-r.y);
    if(d<closestDist){closest=r;closestDist=d;}
  }
  if(!closest){player.miningTarget=null;player.mineProgress=0;return;}
  if(player.miningTarget!==closest){player.miningTarget=closest;player.mineProgress=0;}
  player.mineProgress+=dt/1.4*player.mineSpeedMult;
  if(frame%5===0)spawnParticles(closest.x,closest.y,RES_DATA[closest.type].color,2);
  if(player.mineProgress>=1){
    player.mineProgress=0;
    const total=player.inv.reduce((a,b)=>a+b,0);
    if(total<player.maxInv){
      player.inv[closest.type]++;
      closest.amount--;
      achievements.miner.current++;
      spawnParticles(closest.x,closest.y,RES_DATA[closest.type].color,10);
    }
  }
}

function updateAchievements(dt){
  achievements.survivor1h.current=Math.floor(player.survivalTime);
  achievements.survivor6h.current=Math.floor(player.survivalTime);
  achievements.builder.current=world.structures.length;
}

function playerAttack(){
  //Player has no combat - F key is now unused
}

function updateAliens(dt){
  // No more aliens in this version - removed for survival focus
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render(){
  const night=Math.max(0,Math.sin(dayCycle*Math.PI*2-Math.PI)*0.9+0.2);
  const bg=lerpCol([14,6,28],[4,1,10],Math.min(1,night*1.4));
  ctx.fillStyle=`rgb(${bg[0]},${bg[1]},${bg[2]})`;
  ctx.fillRect(0,0,CVW,CVH);
  if(night>0.1){ctx.fillStyle=`rgba(0,0,12,${night*0.45})`;ctx.fillRect(0,0,CVW,CVH);}

  ctx.save(); ctx.translate(-cam.x,-cam.y);
  renderTiles(); renderStructures(); renderResources(); renderParticles(); renderPlayer();
  if(buildMode!==null)renderBuildGhost();
  ctx.restore();
  renderHUD();
}

function renderTiles(){
  const sx=Math.max(0,Math.floor(cam.x/TILE)),sy=Math.max(0,Math.floor(cam.y/TILE));
  const ex=Math.min(COLS-1,sx+Math.ceil(CVW/TILE)+1),ey=Math.min(ROWS-1,sy+Math.ceil(CVH/TILE)+1);
  for(let y=sy;y<=ey;y++) for(let x=sx;x<=ex;x++){
    const t=world.tiles[y*COLS+x],px=x*TILE,py=y*TILE;
    switch(t){
      case T.GROUND:drawGround(px,py,x,y);break;
      case T.ROCK:drawRock(px,py,x,y,false);break;
      case T.DEEP:drawRock(px,py,x,y,true);break;
      case T.SAND:drawSand(px,py,x,y);break;
      case T.FLORA:drawFlora(px,py,x,y);break;
      case T.VOID:ctx.fillStyle='#060011';ctx.fillRect(px,py,TILE,TILE);break;
    }
  }
}

function drawGround(px,py,tx,ty){
  const v=rng(tx*73+ty*41)*0.18;
  ctx.fillStyle=`rgb(${Math.floor(18+v*28)},${Math.floor(9+v*16)},${Math.floor(32+v*38)})`;
  ctx.fillRect(px,py,TILE,TILE);
  ctx.strokeStyle='rgba(55,25,75,0.25)'; ctx.lineWidth=0.5;
  ctx.strokeRect(px,py,TILE,TILE);
  if(rng(tx*19+ty*91)>0.82){
    ctx.fillStyle=`rgba(80,40,110,${rng(tx+ty)*0.4+0.1})`;
    ctx.beginPath(); ctx.arc(px+rng(tx*31)*TILE,py+rng(ty*37)*TILE,1.5,0,Math.PI*2); ctx.fill();
  }
}

function drawRock(px,py,tx,ty,deep){
  ctx.fillStyle=deep?'#07001a':'#110828'; ctx.fillRect(px,py,TILE,TILE);
  ctx.fillStyle=deep?'#0d0030':'#1a0e40';
  const pts=[[8,8],[24,6],[4,22],[26,20],[14,14]];
  for(const[ox,oy]of pts) if(rng(tx*ox+ty*oy)>0.55) ctx.fillRect(px+ox,py+oy,rng(tx+oy)*10+4,rng(ty+ox)*8+3);
  if(deep){ctx.strokeStyle='rgba(90,0,180,0.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(px+rng(tx)*TILE,py);ctx.lineTo(px+rng(tx+1)*TILE,py+TILE);ctx.stroke();}
}

function drawSand(px,py,tx,ty){
  const v=rng(tx*23+ty*17)*0.2;
  ctx.fillStyle=`rgb(${Math.floor(58+v*38)},${Math.floor(28+v*18)},${Math.floor(18+v*12)})`;
  ctx.fillRect(px,py,TILE,TILE);
}

function drawFlora(px,py,tx,ty){
  drawGround(px,py,tx,ty);
  const phase=frame*0.035+rng(tx+ty)*6.28,sw=Math.sin(phase)*2.5;
  const h=10+rng(tx*7+ty*3)*14;
  const hue=rng(tx+ty*3)>0.5?'#00ff88':'#ff44aa';
  ctx.strokeStyle=hue; ctx.lineWidth=2; ctx.shadowColor=hue; ctx.shadowBlur=8;
  ctx.beginPath();
  ctx.moveTo(px+TILE/2,py+TILE-4);
  ctx.bezierCurveTo(px+TILE/2+sw,py+TILE-h*0.5,px+TILE/2+sw*2,py+TILE-h*0.8,px+TILE/2+sw*3,py+TILE-h);
  ctx.stroke(); ctx.shadowBlur=0;
  ctx.fillStyle=hue; ctx.shadowColor=hue; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(px+TILE/2+sw*3,py+TILE-h,3.5,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
}

function renderResources(){
  for(const r of world.resources){
    if(r.amount<=0)continue;
    const scrx=r.x-cam.x,scry=r.y-cam.y;
    if(scrx<-50||scrx>CVW+50||scry<-50||scry>CVH+50)continue;
    const d=RES_DATA[r.type],pulse=Math.sin(frame*0.05+r.id)*0.3+0.7,sz=(0.7+(r.amount/r.maxAmount)*0.6)*9;
    ctx.save(); ctx.shadowColor=d.color; ctx.shadowBlur=14*pulse;
    for(let i=0;i<r.amount;i++){
      const ang=(i/r.amount)*Math.PI*2,cx=r.x+Math.cos(ang)*(sz*0.8),cy=r.y+Math.sin(ang)*(sz*0.8);
      drawCrystal(cx,cy,sz*0.55,d.color,ang+frame*0.015);
    }
    drawCrystal(r.x,r.y,sz,d.color,frame*0.022*(r.type%2?1:-1));
    if(player.miningTarget===r&&player.mineProgress>0){
      const bw=38;
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(r.x-bw/2,r.y-24,bw,5);
      ctx.fillStyle=d.color; ctx.shadowBlur=8;
      ctx.fillRect(r.x-bw/2,r.y-24,bw*player.mineProgress,5);
    }
    ctx.restore();
  }
}

function drawCrystal(x,y,s,color,angle){
  ctx.save(); ctx.translate(x,y); ctx.rotate(angle); ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(0,-s*1.5); ctx.lineTo(s*0.48,0); ctx.lineTo(0,s*0.7); ctx.lineTo(-s*0.48,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.28)';
  ctx.beginPath(); ctx.moveTo(0,-s*1.5); ctx.lineTo(s*0.14,-s*0.25); ctx.lineTo(0,-s*0.15); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function renderStructures(){
  for(const s of world.structures){
    const rx=s.wx-cam.x,ry=s.wy-cam.y;
    if(rx+s.w<0||rx>CVW||ry+s.h<0||ry>CVH)continue;
    ctx.save();
    if(s.type===0){renderHabitat(s);}
    else if(s.type===1){renderSolar(s);}
    else {
      const d=STRUCT_DATA[s.type];
      ctx.fillStyle='#141424'; ctx.fillRect(s.wx+3,s.wy+3,s.w-6,s.h-6);
      ctx.strokeStyle=d.color; ctx.lineWidth=2; ctx.shadowColor=d.color; ctx.shadowBlur=8;
      ctx.strokeRect(s.wx+3,s.wy+3,s.w-6,s.h-6); ctx.shadowBlur=0;
      ctx.fillStyle=d.color; ctx.font='bold 10px Courier New'; ctx.textAlign='center';
      ctx.fillText(d.name.toUpperCase(),s.wx+s.w/2,s.wy+s.h/2+4);
    }
    ctx.restore();
  }
}

function renderHabitat(s){
  ctx.fillStyle='#08122a'; ctx.fillRect(s.wx+4,s.wy+s.h/2,s.w-8,s.h/2-4);
  ctx.fillStyle='#162a52'; ctx.beginPath();
  ctx.ellipse(s.wx+s.w/2,s.wy+s.h/2,s.w/2-3,s.h/2,0,Math.PI,0,true); ctx.fill();
  ctx.fillStyle='rgba(80,170,255,0.12)'; ctx.beginPath();
  ctx.ellipse(s.wx+s.w/2,s.wy+s.h/2,s.w/2-6,s.h/2-3,0,Math.PI,0,true); ctx.fill();
  const pulse=Math.sin(frame*0.04)*0.18+0.82;
  const grad=ctx.createRadialGradient(s.wx+s.w/2,s.wy+s.h/2,0,s.wx+s.w/2,s.wy+s.h/2,170);
  grad.addColorStop(0,`rgba(40,140,255,${0.07*pulse})`); grad.addColorStop(1,'rgba(40,140,255,0)');
  ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(s.wx+s.w/2,s.wy+s.h/2,170,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2277ee'; ctx.shadowColor='#3388ff'; ctx.shadowBlur=10;
  ctx.fillRect(s.wx+6,s.wy+s.h/2-2,s.w-12,4); ctx.shadowBlur=0;
  // Porthole light
  ctx.fillStyle='#88ccff'; ctx.shadowColor='#88ccff'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.arc(s.wx+s.w/2,s.wy+s.h/3,6,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
}

function renderSolar(s){
  ctx.fillStyle='#181820'; ctx.fillRect(s.wx+3,s.wy+3,s.w-6,s.h-6);
  const brightness=Math.max(0,Math.sin((dayCycle-0.25)*Math.PI*2)*0.7+0.3)*(dayCycle<0.5?1:0.1);
  const cols=3,rows=2,cw=(s.w-10)/cols,ch=(s.h-8)/rows;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const B=Math.floor(brightness*220);
    ctx.fillStyle=`rgb(${Math.floor(B*0.35)},${Math.floor(B*0.28)},${B})`;
    ctx.fillRect(s.wx+5+c*cw,s.wy+4+r*ch,cw-2,ch-2);
  }
  ctx.strokeStyle='#ffee88'; ctx.lineWidth=1; ctx.shadowColor='#ffee88'; ctx.shadowBlur=brightness*10;
  ctx.strokeRect(s.wx+3,s.wy+3,s.w-6,s.h-6); ctx.shadowBlur=0;
}

function renderPlayer(){
  if(!player.alive)return;
  const leg=Math.sin(player.walkAnim)*5;
  ctx.save(); ctx.translate(player.x,player.y);
  if(player.facing===-1)ctx.scale(-1,1);
  ctx.shadowColor='#88aaff'; ctx.shadowBlur=12;
  // Jet pack glow
  if(Math.abs(player.vx)+Math.abs(player.vy)>20){
    ctx.fillStyle='rgba(100,150,255,0.3)';
    ctx.beginPath(); ctx.arc(7,5,6,0,Math.PI*2); ctx.fill();
  }
  // Legs
  ctx.fillStyle='#4a5580'; ctx.fillRect(-8,8,6,10+leg); ctx.fillRect(2,8,6,10-leg);
  // Body
  ctx.fillStyle='#c8962c'; ctx.fillRect(-9,-8,18,18);
  // Suit detail
  ctx.fillStyle='#aa7c1e'; ctx.fillRect(-7,-4,6,8); ctx.fillRect(4,-4,6,8);
  // Backpack
  ctx.fillStyle='#7a7a8c'; ctx.fillRect(7,-7,6,14);
  ctx.fillStyle='#5588cc'; ctx.fillRect(8,-5,4,4);
  // Helmet
  ctx.fillStyle='#c8962c'; ctx.beginPath(); ctx.arc(0,-12,10,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#aa7c1e'; ctx.fillRect(-7,-14,14,4);
  // Visor
  const o2ok=player.o2/player.maxO2>0.3;
  ctx.fillStyle=o2ok?'#22ccee':'#ff3300';
  ctx.shadowColor=o2ok?'#22ccee':'#ff3300'; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.arc(2,-13,6.5,-0.35,Math.PI+0.35); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.beginPath();
  ctx.arc(-1,-15,2.5,0,Math.PI*2); ctx.fill();
  // Arms
  ctx.fillStyle='#b88820'; ctx.shadowBlur=0;
  const sw=Math.sin(player.walkAnim+Math.PI)*5;
  ctx.fillRect(-15,-5+sw,7,13); ctx.fillRect(8,-5-sw,7,13);
  ctx.restore();
}

function renderAliens(){
  // Aliens removed from game
}

function renderParticles(){
  for(const p of world.particles){
    const t=p.life/p.maxLife;
    ctx.save(); ctx.globalAlpha=t; ctx.fillStyle=p.color;
    ctx.shadowColor=p.color; ctx.shadowBlur=7;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*t,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
}

function renderBuildGhost(){
  const tx=Math.floor(mouse.wx/TILE),ty=Math.floor(mouse.wy/TILE);
  const valid=canPlace(buildMode,tx,ty)&&canAfford(buildMode);
  const sd=STRUCT_DATA[buildMode];
  ctx.save(); ctx.globalAlpha=0.52;
  ctx.fillStyle=valid?sd.color+'44':'#ff000033';
  ctx.strokeStyle=valid?sd.color:'#ff4444'; ctx.lineWidth=2;
  ctx.fillRect(tx*TILE,ty*TILE,sd.w*TILE,sd.h*TILE);
  ctx.strokeRect(tx*TILE,ty*TILE,sd.w*TILE,sd.h*TILE);
  ctx.restore();
}

// ─── HUD ─────────────────────────────────────────────────────────────────────
function renderHUD(){
  // Top bar
  ctx.fillStyle='rgba(2,0,10,0.78)'; ctx.fillRect(0,0,CVW,52);

  bar(18,13,190,16,player.o2/player.maxO2,'#0088cc','#00ccff','O²');
  bar(225,13,190,16,player.health/player.maxHealth,'#880022','#ff2244','HP');

  // Day indicator
  const dn=dayCycle<0.5;
  ctx.save(); ctx.shadowColor=dn?'#ffdd44':'#6677ff'; ctx.shadowBlur=14;
  ctx.fillStyle=dn?'#ffdd44':'#8899ff';
  ctx.beginPath(); ctx.arc(CVW/2+Math.cos(dayCycle*Math.PI*2-Math.PI/2)*15,26+Math.sin(dayCycle*Math.PI*2-Math.PI/2)*8,dn?6:4.5,0,Math.PI*2); ctx.fill();
  ctx.restore(); ctx.fillStyle='#404060'; ctx.font='9px Courier New'; ctx.textAlign='center';
  ctx.fillText(dn?'DIA':'NOITE',CVW/2,46);
  // Clock arc
  ctx.strokeStyle='rgba(60,60,100,0.4)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(CVW/2,26,16,0,Math.PI*2); ctx.stroke();

  // Inventory (top right)
  let rx=CVW-12;
  for(let i=4;i>=0;i--){
    if(player.inv[i]<=0)continue;
    const d=RES_DATA[i];
    ctx.fillStyle=d.color; ctx.shadowColor=d.color; ctx.shadowBlur=7;
    ctx.font='bold 11px Courier New'; ctx.textAlign='right';
    ctx.fillText(`${d.name.slice(0,3).toUpperCase()}:${player.inv[i]}`,rx,19);
    ctx.shadowBlur=0; rx-=82;
  }

  // Score + kills
  ctx.fillStyle='#303050'; ctx.font='10px Courier New'; ctx.textAlign='right';
  ctx.fillText(`${Math.floor(player.survivalTime)}s · Score ${player.score}`,CVW-12,46);

  // Bottom bar / build buttons
  if(buildMode!==null){
    ctx.fillStyle='rgba(2,0,10,0.88)'; ctx.fillRect(0,CVH-54,CVW,54);
    ctx.strokeStyle='#334499'; ctx.lineWidth=1; ctx.strokeRect(0,CVH-54,CVW,54);
    const sd=STRUCT_DATA[buildMode];
    ctx.fillStyle=sd.color; ctx.shadowColor=sd.color; ctx.shadowBlur=10;
    ctx.font='bold 12px Courier New'; ctx.textAlign='center';
    ctx.fillText(`CONSTRUINDO: ${sd.name.toUpperCase()} — CLIQUE PARA COLOCAR  |  ESC CANCELAR`,CVW/2,CVH-30);
    ctx.shadowBlur=0;
    // Cost display
    let cx=CVW/2-Object.keys(sd.cost).length*55;
    ctx.fillStyle='#404060'; ctx.font='10px Courier New';
    ctx.fillText('Custo: '+Object.entries(sd.cost).map(([k,v])=>`${v} ${RES_DATA[+k].name}`).join(' + '),CVW/2,CVH-12);
  } else {
    ctx.fillStyle='rgba(2,0,10,0.78)'; ctx.fillRect(0,CVH-46,CVW,46);
    STRUCT_DATA.forEach((sd,i)=>{
      const bx=14+i*150,afford=canAfford(i);
      ctx.strokeStyle=afford?sd.color:'#252535'; ctx.lineWidth=1;
      ctx.fillStyle=afford?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.3)';
      ctx.fillRect(bx,CVH-40,140,34); ctx.strokeRect(bx,CVH-40,140,34);
      ctx.fillStyle=afford?sd.color:'#303050'; ctx.font='11px Courier New'; ctx.textAlign='left';
      ctx.fillText(`[${i+1}] ${sd.name}`,bx+8,CVH-20);
      ctx.fillStyle=afford?'#606080':'#252540'; ctx.font='9px Courier New';
      ctx.fillText(sd.desc,bx+8,CVH-9);
    });
    ctx.fillStyle='#252540'; ctx.font='10px Courier New'; ctx.textAlign='right';
    ctx.fillText('E MINERAR  F ATACAR  1-4 CONSTRUIR',CVW-12,CVH-10);
  }

  // Mining hint
  const closeR=world.resources.find(r=>r.amount>0&&Math.hypot(player.x-r.x,player.y-r.y)<75);
  if(closeR&&!buildMode){
    const d=RES_DATA[closeR.type];
    ctx.fillStyle=d.color; ctx.shadowColor=d.color; ctx.shadowBlur=12;
    ctx.font='12px Courier New'; ctx.textAlign='center';
    ctx.fillText(`[ E ] Minerar ${d.name} (×${closeR.amount})`,CVW/2,CVH-58); ctx.shadowBlur=0;
  }

  // Night warning
  const trans=Math.min(1,(Math.abs(dayCycle-0.5)*DAY_PERIOD<8||dayCycle*DAY_PERIOD<8)?1:0);
  if(trans>0){
    const msg=dayCycle>0.4&&dayCycle<0.6?'⚠  NOITE — ALIENÍGENAS ATIVOS':'☀  AMANHECER';
    ctx.fillStyle=dayCycle>0.4?'#ff5533':'#ffcc33';
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=18;
    ctx.font='bold 15px Courier New'; ctx.textAlign='center';
    ctx.fillText(msg,CVW/2,CVH/2-50); ctx.shadowBlur=0;
  }

  // Low O2
  if(player.o2<20){
    if(Math.sin(frame*0.22)>0){
      ctx.fillStyle='rgba(255,40,0,0.13)'; ctx.fillRect(0,0,CVW,CVH);
      ctx.fillStyle='#ff3300'; ctx.shadowColor='#ff3300'; ctx.shadowBlur=22;
      ctx.font='bold 15px Courier New'; ctx.textAlign='center';
      ctx.fillText('⚠  OXIGÊNIO CRÍTICO — RETORNE AO HABITAT',CVW/2,CVH/2); ctx.shadowBlur=0;
    }
  }

  // Minimap
  renderMinimap();
}

function bar(x,y,w,h,pct,bgc,fgc,label){
  ctx.fillStyle='rgba(0,0,15,0.7)'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=bgc; ctx.fillRect(x+1,y+1,(w-2)*Math.max(0,pct),h-2);
  ctx.strokeStyle=fgc; ctx.lineWidth=1;
  ctx.shadowColor=pct<0.25?fgc:'transparent'; ctx.shadowBlur=pct<0.25?10:0;
  ctx.strokeRect(x,y,w,h); ctx.shadowBlur=0;
  ctx.fillStyle='#5a5a7a'; ctx.font='9px Courier New'; ctx.textAlign='left';
  ctx.fillText(label,x+4,y+h+11);
}

function renderMinimap(){
  const mmx=CVW-108,mmy=54,mmw=100,mmh=80;
  ctx.fillStyle='rgba(0,0,12,0.8)'; ctx.fillRect(mmx,mmy,mmw,mmh);
  ctx.strokeStyle='#223355'; ctx.lineWidth=1; ctx.strokeRect(mmx,mmy,mmw,mmh);

  const sx=mmw/COLS,sy=mmh/ROWS;
  // Resources
  for(const r of world.resources){
    if(r.amount<=0)continue;
    const rx=mmx+(r.x/TILE)*sx,ry=mmy+(r.y/TILE)*sy;
    ctx.fillStyle=RES_DATA[r.type].color+'88';
    ctx.fillRect(rx,ry,1.5,1.5);
  }
  // Structures
  for(const s of world.structures){
    ctx.fillStyle=STRUCT_DATA[s.type].color;
    ctx.fillRect(mmx+s.tx*sx,mmy+s.ty*sy,s.w/TILE*sx+1,s.h/TILE*sy+1);
  }
  // Aliens
  for(const a of world.aliens){
    if(a.dying)continue;
    ctx.fillStyle=a.color;
    ctx.fillRect(mmx+(a.x/TILE)*sx,mmy+(a.y/TILE)*sy,2,2);
  }
  // Player
  const px=mmx+(player.x/TILE)*sx,py=mmy+(player.y/TILE)*sy;
  ctx.fillStyle='#ffffff'; ctx.shadowColor='#ffffff'; ctx.shadowBlur=6;
  ctx.beginPath(); ctx.arc(px,py,2.5,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
}

// ─── INPUT ───────────────────────────────────────────────────────────────────
function setupInput(){
  window.addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(e.code==='Escape')buildMode=null;
    if(e.code==='KeyP'&&running){ paused=!paused; document.getElementById('screen-pause').style.display=paused?'flex':'none'; }
    if(!buildMode){
      const m={'Digit1':0,'Digit2':1,'Digit3':2,'Digit4':3};
      if(m[e.code]!==undefined&&canAfford(m[e.code])){buildMode=m[e.code];e.preventDefault();}
    }
    if(e.code==='KeyF'&&player.alive)playerAttack();
  });
  window.addEventListener('keyup',e=>{keys[e.code]=false;});
  canvas.addEventListener('mousemove',e=>{
    const r=canvas.getBoundingClientRect();
    mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top;
    mouse.wx=mouse.x+cam.x; mouse.wy=mouse.y+cam.y;
  });
  canvas.addEventListener('click',()=>{
    if(buildMode!==null&&player.alive){
      const tx=Math.floor(mouse.wx/TILE),ty=Math.floor(mouse.wy/TILE);
      if(canPlace(buildMode,tx,ty)&&canAfford(buildMode))placeStructure(buildMode,tx,ty);
      else if(!canAfford(buildMode)){
        // flash message
      }
      buildMode=null;
    }
  });
}

// ─── TECH TREE & ACHIEVEMENTS ──────────────────────────────────────────────
function initTechTree(){
  techTree={
    mineSpeedup1:{name:'Broca Mel',cost:{7:2},bonus:{mineSpeedMult:1.3},unlocked:false},
    mineSpeedup2:{name:'Broca Avançada',cost:{7:4,10:3},bonus:{mineSpeedMult:1.6},requires:['mineSpeedup1'],unlocked:false},
    o2Extender1:{name:'Tanque O2 Port',cost:{7:3,2:4},bonus:{maxO2:150},unlocked:false},
    o2Extender2:{name:'Suit Osmótica',cost:{7:6,11:4},bonus:{maxO2:200,o2ConsumptionMult:0.7},requires:['o2Extender1'],unlocked:false},
  };
}

function initAchievements(){
  achievements={
    survivor1h:{name:'Sobrevivente',desc:'1h no planeta',target:3600,current:0,unlocked:false},
    survivor6h:{name:'Veterano',desc:'6h no planeta',target:21600,current:0,unlocked:false},
    miner:{name:'Minerador',desc:'500 recursos',target:500,current:0,unlocked:false},
    builder:{name:'Construtor',desc:'20 estruturas',target:20,current:0,unlocked:false},
  };
}

function spawnWeatherParticles(){
  if(!eventType)return;
  const count=eventType==='acidRain'?8:eventType==='meteor'?5:eventType==='aurora'?12:4;
  const color=eventType==='acidRain'?'#00ff00':eventType==='meteor'?'#ffaa00':eventType==='aurora'?'#00ffff':'#888888';
  for(let i=0;i<count;i++){
    const x=player.x+Math.random()*400-200;
    const y=player.y+Math.random()*400-200;
    spawnParticles(x,y,color,2);
  }
  if(eventType==='acidRain'&&player.nearHabitat===false){
    player.health-=5*0.016;
  }
}

// ─── GAME FLOW ───────────────────────────────────────────────────────────────
function startGame(){
  document.getElementById('screen-title').style.display='none';
  document.getElementById('screen-gameover').style.display='none';
  initTechTree();
  initAchievements();
  world.tiles=generateWorld();
  world.resources=spawnResources();
  world.structures=[]; world.particles=[]; world.aliens=[];
  player=initPlayer();
  const sx=Math.floor(COLS/2)-1,sy=Math.floor(ROWS/2)-1;
  placeStructure(0,sx,sy,true); // free habitat at start
  // Spawn the player just outside the habitat so movement is never blocked at start.
  player.x=(sx+1)*TILE+TILE/2;
  player.y=(sy+2)*TILE+TILE/2;
  cam.x=player.x-CVW/2; cam.y=player.y-CVH/2;
  gameTime=0; dayCycle=0.1; frame=0; buildMode=null;
  running=true; lastTime=performance.now();
  requestAnimationFrame(loop);
}

function showTitle(){
  running=false;
  document.getElementById('screen-gameover').style.display='none';
  document.getElementById('screen-title').style.display='flex';
}

function loop(ts){
  if(!running)return;
  const dt=Math.min((ts-lastTime)/1000,0.05); lastTime=ts;
  update(dt); render();
  requestAnimationFrame(loop);
}

// ─── BOOT ────────────────────────────────────────────────────────────────────
canvas=document.getElementById('c');
canvas.width=CVW; canvas.height=CVH;
ctx=canvas.getContext('2d');
setupInput();
</script>
